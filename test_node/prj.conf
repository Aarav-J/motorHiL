# HIL test node for the STM32F446RE ECU project.
#
# Three jobs this firmware does:
#   1. Read the STM32's PWM duty cycle (GPIO input capture off PB6/D10's
#      physical signal).
#   2. Run a motor plant model (duty -> simulated speed) and drive two GPIO
#      pins as quadrature A/B output into the STM32's TIM3 encoder inputs
#      (PA6/PA7) -- same physical role the AD2 played, now on dedicated
#      hardware instead of a flaky desktop USB/driver stack.
#   3. Expose a plain-text command/telemetry channel over UART to the
#      laptop for pytest-driven test orchestration (set plant params,
#      inject encoder-dropout faults, report simulated state).

CONFIG_GPIO=y
CONFIG_PWM=y

# Laptop-facing command/telemetry channel + boot console
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Logging -- for the low-priority diagnostic thread, kept separate from the
# time-critical plant simulation, same principle as the STM32 side's
# ISR-does-minimal-work / main()-does-reporting split.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Plant simulation + command handling run as a dedicated thread, not just
# whatever Zephyr's default main thread happens to schedule -- decide stack
# size / priority once you know the actual peripheral access pattern
# (interrupt-driven PWM capture vs. polled) for the plant-update loop.
CONFIG_MULTITHREADING=y
